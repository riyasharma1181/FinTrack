<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget - FinTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

    <!-- Header -->

    <header>

        <h1>FinTrack</h1>

        <nav>

            <a href="{{ url_for('home') }}">
                Dashboard
            </a>

            <a href="{{ url_for('add_page') }}">
                Add Expense
            </a>

            <a href="{{ url_for('income_page') }}">
                Add Income
            </a>

            <a href="{{ url_for('monthly_page') }}">
                Analytics
            </a>

            <a href="{{ url_for('recent_page') }}">
                Transactions
            </a>

            <a href="{{ url_for('budget_page') }}">
                Budget
            </a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        <h2>Budget Management</h2>

        <p>
            Set spending limits for different categories
            and keep track of your financial goals.
        </p>


        <!-- Budget Form -->

        <form id="budgetForm">

            <label for="budgetCategory">
                Category
            </label>

            <select
                id="budgetCategory"
                name="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Restaurants">
                    Restaurants
                </option>

                <option value="Furniture/Home">
                    Furniture/Home
                </option>

                <option value="Gas/Car">
                    Gas/Car
                </option>

                <option value="Clothes">
                    Clothes
                </option>

                <option value="School/Office Supplies">
                    School/Office Supplies
                </option>

                <option value="Misc">
                    Misc
                </option>

                <option value="Groceries">
                    Groceries
                </option>

            </select>


            <label for="budgetAmount">
                Budget Amount
            </label>

            <input
                type="number"
                id="budgetAmount"
                name="amount"
                placeholder="Enter budget amount"
                min="0"
                step="0.01"
                required
            >


            <button type="submit">
                Save Budget
            </button>

        </form>


        <p id="budgetStatus"></p>


        <!-- Current Budgets -->

        <h2>Current Budgets</h2>

        <div id="budgetList">

            <p>
                Loading budgets...
            </p>

        </div>

    </main>


    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
